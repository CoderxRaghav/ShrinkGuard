services:

  postgres:
    image: postgres:18
    container_name: shrinkguard-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    container_name: shrinkguard-redis
    ports:
      - "6379:6379"

  api:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./.env
    depends_on:
      - postgres
      - redis

  worker:
    build: ./backend
    container_name: shrinkguard-worker
    command: node src/workers/clickWorker.js
    env_file:
      - ./.env
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
